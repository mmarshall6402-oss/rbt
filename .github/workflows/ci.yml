name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @fieldtrack/rules test
      - run: pnpm --filter @fieldtrack/web build

  api:
    name: API + database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: fieldtrack_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fieldtrack/api test
        env: { TEST_DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/fieldtrack_test' }

  migrations:
    name: Migrations apply cleanly on main's schema with data
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: fieldtrack }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fieldtrack
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Frozen migrations are unchanged
        run: |
          base="origin/${{ github.base_ref }}"
          git show "$base:db/migrations/.frozen" 2>/dev/null | while read -r f; do
            [ -z "$f" ] && continue
            if ! git diff --quiet "$base" -- "db/migrations/$f"; then echo "::error::$f already ran in production. Write a new migration instead of editing it."; exit 1; fi
          done
      - name: Build main's schema and load realistic data
        run: |
          mkdir -p /tmp/base && git archive "origin/${{ github.base_ref }}" db/migrations | tar -x -C /tmp/base
          MIGRATIONS_DIR=/tmp/base/db/migrations pnpm db:migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/sample.sql
      - name: Apply this PR's migrations on top
        run: pnpm db:migrate
      - name: Re-running is a no-op
        run: pnpm db:migrate | grep -q "Database is up to date"
      - name: Data survived
        run: |
          test "$(psql "$DATABASE_URL" -tAc 'select count(*) from entries')" -gt 150
          test "$(psql "$DATABASE_URL" -tAc 'select count(*) from audit_log')" -gt 150

  e2e:
    name: End-to-end (real browser, production build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: fieldtrack }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fieldtrack
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fieldtrack
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @fieldtrack/web exec playwright install --with-deps chromium
      - run: pnpm --filter @fieldtrack/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: apps/web/test-results, retention-days: 7 }

  dast:
    name: Security scan of the running app (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: fieldtrack }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fieldtrack
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @fieldtrack/web build
      - name: Start the API and the production build (served with the production security headers)
        run: |
          node apps/api/scripts/fetch-forms.mjs
          (cd apps/api && AUTH_MODE=dev PORT=3000 nohup pnpm exec tsx src/server.ts > /tmp/api.log 2>&1 &)
          (cd apps/web && nohup pnpm exec vite preview --port 4173 --strictPort > /tmp/web.log 2>&1 &)
          for _ in $(seq 60); do curl -sf http://localhost:4173/api/health > /dev/null && exit 0; sleep 1; done
          cat /tmp/api.log /tmp/web.log; exit 1
      - name: ZAP baseline (fails on the rules marked FAIL in .zap/rules.tsv)
        run: |
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:4173 -c rules.tsv -r report.html -J report.json -j || code=$?
          # 1 = a FAIL rule fired; 2 = warnings only (reported, not blocking)
          [ "${code:-0}" -ne 1 ] && [ "${code:-0}" -ne 3 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: zap-report, path: zap, retention-days: 14 }

  image:
    name: API container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/api/Dockerfile, push: false, tags: fieldtrack-api:ci }

  infra:
    name: Terraform validate + security scan, workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate each environment
        run: |
          for env in staging prod; do
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/envs/$env validate
          done
      - name: Security scan (skips are documented inline with reasons)
        uses: bridgecrewio/checkov-action@v12
        with: { directory: infra/terraform/modules/app, framework: terraform, quiet: true }
      - name: Lint workflows
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
