version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: typescript # TS 7 (native compiler) is a deliberate future upgrade, not a weekly bump
        update-types: [version-update:semver-major]
      - dependency-name: '@playwright/test' # pinned to the browser build preinstalled in dev containers
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories: [/infra/terraform/envs/prod, /infra/terraform/envs/staging]
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly }
