services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fieldtrack
      POSTGRES_PASSWORD: fieldtrack # local dev only
      POSTGRES_DB: fieldtrack
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fieldtrack"]
      interval: 5s
volumes:
  pgdata:
